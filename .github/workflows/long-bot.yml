name: Long Bot - USA Viral

on:
  workflow_dispatch:
    inputs:
      manual_topic:
        description: 'Manual topic (optional, leave empty for auto American trends)'
        required: false
        default: ''
      manual_title:
        description: 'Manual title (optional)'
        required: false
        default: ''
  schedule:
    - cron: '0 1 * * *'

jobs:
  run-long-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install BEST FREE FFmpeg latest
        run: |
          sudo apt update
          sudo apt install -y ffmpeg
          ffmpeg -version
      
      - name: Install dependencies FIXED
        run: |
          python -m pip install --upgrade pip
          pip install google-genai google-generativeai requests moviepy==1.0.3 pillow piper-tts feedparser
          # Verify genai import works
          python -c "try:
            from google import genai
            print('NEW SDK OK')
          except:
            import google.generativeai
            print('OLD SDK OK')"
      
      - name: Run Long Bot - American Audience Viral
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          CHANNEL_NAME: "Uncovered USA 24"
          MANUAL_TOPIC: ${{ github.event.inputs.manual_topic }}
          MANUAL_TITLE: ${{ github.event.inputs.manual_title }}
        run: |
          python long_bot.py
