name: Long Video - USA Girl Viral

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # Daily 2 PM ETC

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache Piper Model
        uses: actions/cache@v4
        id: cache-piper
        with:
          path: |
            en_US-lessac-medium.onnx
            en_US-lessac-medium.onnx.json
          key: piper-model-v1

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install moviepy==1.0.3 Pillow==9.5.0 requests gtts numpy google-api-python-client google-auth-httplib2 google-auth-oauthlib
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak

      - name: Download Piper Model (if not cached)
        if: steps.cache-piper.outputs.cache-hit!= 'true'
        run: |
          echo "Downloading Piper model - may take 2 min..."
          wget --progress=bar:force https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx -O en_US-lessac-medium.onnx
          wget --progress=bar:force https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json -O en_US-lessac-medium.onnx.json
          ls -lh *.onnx*
          echo "Piper model downloaded!"

      - name: Verify Model Exists
        run: |
          if [ -f "en_US-lessac-medium.onnx" ]; then
            echo "✅ Piper model found - using Piper"
          else
            echo "⚠️ Piper model not found - will use gTTS fallback"
          fi

      - name: Run Long Video Bot
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python bot_long_video.py
