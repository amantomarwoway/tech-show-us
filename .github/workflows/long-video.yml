name: Long Video USA Evergreen - 3x Week

on:
  schedule:
    - cron: '0 18 * * 1,3,5'
  workflow_dispatch:

jobs:
  long:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install System Dependencies + Piper TTS
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg espeak espeak-ng
          pip install -r requirements.txt
          pip install gTTS moviepy==1.0.3 Pillow numpy requests feedparser google-api-python-client piper-tts
          # Piper TTS - 100% offline, human emotional voice, no www.com error
          echo "Downloading Piper TTS model - lessac medium - US male energetic"
          wget -q https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx -O en_US-lessac-medium.onnx
          wget -q https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json -O en_US-lessac-medium.onnx.json
          ls -lh en_US-lessac-medium.onnx*
          echo "Piper TTS ready - offline human voice"
      - name: Run Long Video - Products + Big Machine + Army + World Trending
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python bot_long_video.py
