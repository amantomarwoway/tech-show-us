name: Long Video USA - 4K ULTIMATE - All 3 Fixes
on:
  schedule:
    - cron: '0 18 * * 1,4'
  workflow_dispatch:
jobs:
  run-long-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install System Deps - 4K + JPEG Fix + FFmpeg Reinstall
        run: |
          sudo apt-get update
          sudo apt-get remove ffmpeg -y || true
          sudo apt-get install -y ffmpeg espeak espeak-ng libjpeg-dev libpng-dev
          ffmpeg -version
          python -m pip install --upgrade pip wheel
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python Deps - CORRECTED - All 3 Root Causes Fixed
        run: |
          pip install "Pillow==9.5.0" "moviepy==2.1.2" "imageio==2.34.1" "imageio-ffmpeg==0.5.1" requests gtts google-api-python-client google-auth-httplib2 google-auth-oauthlib numpy
          pip install piper-tts || true
      - name: Download Piper model
        run: |
          wget -q https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx || true
          wget -q https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json || true
      - name: Run Long Video Bot - ULTIMATE BULLETPROOF
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python bot_long_video.py
      - name: Commit used titles
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add used_long_titles.txt || true
          git commit -m "Update long titles" || true
          git push || true
