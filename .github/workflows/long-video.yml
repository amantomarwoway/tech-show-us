name: Long Video - USA Prime Time - 2x Week - PIPER

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 1,4'  # Monday & Thursday 2 PM EST (USA Best Time) = 6 PM UTC = 11:30 PM IST

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache Piper Model
        uses: actions/cache@v4
        id: cache-piper
        with:
          path: |
            en_US-lessac-medium.onnx
            en_US-lessac-medium.onnx.json
          key: piper-lessac-medium-v3

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak espeak-ng > /dev/null
          pip install --upgrade pip
          pip install moviepy==1.0.3 Pillow==9.5.0 requests gtts numpy google-api-python-client google-auth-httplib2 google-auth-oauthlib piper-tts

      - name: Download Piper Model with Retry
        if: steps.cache-piper.outputs.cache-hit != 'true'
        run: |
          curl -L --progress-bar --retry 5 --retry-delay 5 --connect-timeout 30 --max-time 300 -o en_US-lessac-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx
          curl -L --progress-bar --retry 5 --retry-delay 5 --connect-timeout 30 --max-time 300 -o en_US-lessac-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json
          ls -lh en_US-lessac-medium.onnx*

      - name: Run Bot - USA Girl Piper Voice
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python bot_long_video.py
