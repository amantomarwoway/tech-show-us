name: Long-6x-USA
on:
  workflow_dispatch:
  schedule: [{cron: '0 18 * * 1-6'}]
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg -qq
      - run: pip install -r requirements.txt piper-tts google-api-python-client google-auth -q
      - run: |
          mkdir -p piper; wget -q https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz; tar -xzf piper_linux_x86_64.tar.gz -C piper --strip-components=1; chmod +x piper/piper
          wget -q https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx; wget -q https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json
      - env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -u bot_long_video.py
      - if: always()
        run: git config user.name bot; git config user.email bot@bot.com; git add used_long_titles.txt; git commit -m "up [skip ci]" || true; git push || true
