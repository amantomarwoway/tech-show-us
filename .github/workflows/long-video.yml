name: Long Bot - Worldwide 6x
on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 1-6'
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg -qq
      - run: pip install -r requirements.txt -q
      - run: |
          [ -f en_US-lessac-medium.onnx ] || wget -q https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx
          [ -f en_US-lessac-medium.onnx.json ] || wget -q https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json
      - env:
          PYTHONUNBUFFERED: "1"
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -u bot_long_video.py
      - if: always()
        run: |
          git config user.name bot; git config user.email bot@bot.com
          git add used_long_titles.txt || true; git commit -m "up [skip ci]" || true; git push || true
