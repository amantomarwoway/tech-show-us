name: 3 Shorts USA Time - 4K FINAL
on:
  schedule:
    # 3 per day - Best USA times (UTC) - GitHub Actions uses UTC
    # 11 UTC = 7 AM EDT (Morning US) / 4:30 PM IST
    # 17 UTC = 1 PM EDT (Lunch US) / 10:30 PM IST
    # 23 UTC = 7 PM EDT (Evening Peak US) / 4:30 AM IST next day
    - cron: '0 11 * * *'
    - cron: '0 17 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install --no-cache-dir pytrends lxml
      - name: Install Piper TTS
        run: |
          pip install piper-tts
      - name: Download Piper model
        run: |
          wget https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx
          wget https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json
      - name: Run Shorts Bot
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python bot.py
      - name: Commit used titles
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add used_titles.txt || true
          git commit -m "Update used titles" || true
          git push || true
