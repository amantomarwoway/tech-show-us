name: 6 Shorts USA Time - 4K FINAL
on:
  schedule:
    - cron: '0 11 * * *'
    - cron: '0 17 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Free Disk + System Deps - 4K Fix
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak espeak-ng fonts-dejavu-core libjpeg-dev zlib1g-dev libpng-dev
      - name: Install Python Deps
        run: |
          pip install --upgrade pip wheel
          pip install -r requirements.txt
      - name: Download Piper Model - 4K
        run: |
          curl -L --retry 5 --fail -o en_US-lessac-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx
          curl -L --retry 5 --fail -o en_US-lessac-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json
          ls -lh en_US-lessac-medium.onnx*
      - run: echo '${{ secrets.TOKEN_JSON }}' > token.json
      - name: Run Shorts Bot - 4K
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          QUALITY: "4K"
        run: python bot.py
      - name: Update tracker
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add posted.txt used_titles.txt used_long_titles.txt || true
          git commit -m "update posted - shorts 4K" || true
          git push || true
