name: 6 Shorts USA Time

on:
  schedule:
    - cron: '0 11 * * *'  # 6 AM EST - 11 AM UTC
    - cron: '0 14 * * *'  # 9 AM EST - 2 PM UTC
    - cron: '0 17 * * *'  # 12 PM EST - 5 PM UTC
    - cron: '0 20 * * *'  # 3 PM EST - 8 PM UTC
    - cron: '0 23 * * *'  # 6 PM EST - 11 PM UTC
    - cron: '0 2 * * *'   # 9 PM EST - 2 AM UTC (next day)
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install System Dependencies + Piper TTS - Products + Big Machine + Army
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg espeak espeak-ng fonts-dejavu-core
          pip install -r requirements.txt
          pip install gTTS moviepy==1.0.3 Pillow numpy requests feedparser google-api-python-client piper-tts
          # Piper TTS - 100% offline human emotional tez voice - no www.com error
          echo "Downloading Piper TTS model - US male energetic"
          wget -q https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx -O en_US-lessac-medium.onnx
          wget -q https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json -O en_US-lessac-medium.onnx.json
          ls -lh en_US-lessac-medium.onnx*
          echo "Piper TTS ready - offline human voice - products + big machine + army review ready"
      - run: echo '${{ secrets.TOKEN_JSON }}' > token.json
      - name: Run Shorts Bot - Products + Big Machine + Army + World Trending - Fast 2.5sec Visuals
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python bot.py
      - name: Update posted tracker
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add posted.txt used_titles.txt used_long_titles.txt || true
          git commit -m "update posted - shorts - products+big machine+army" || true
          git push || true
