name: GOD LEVEL BOT - 5 LEGS - World Viral
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install System Deps
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update || true
          sudo apt-get install -y imagemagick ffmpeg
      - name: Install Python Deps - FIXED
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --no-cache-dir -r requirements.txt
          python -c "from moviepy.editor import VideoFileClip; print('moviepy.editor OK')"
      - name: Create dirs
        run: mkdir -p data output temp models && touch src/__init__.py
      - name: Run GOD BOT - REAL AEROPLANE - FULL MECHANISM
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PYTHONPATH: src:.:${{ github.workspace }}:${{ github.workspace }}/src
        run: python main.py
      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: god-output-${{ github.run_number }}
          path: |
            output/
            data/
          if-no-files-found: ignore
