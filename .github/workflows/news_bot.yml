name: GOD LEVEL BOT - MUCKSCRAPER + HOOK/RETAIN/REWARD + VUZA OFFLINE - 5 LEGS - 100% FREE

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Data + Models
        uses: actions/cache@v4
        with:
          path: |
            data/
            models/
            ~/.cache/huggingface
          key: god-data-ollama-${{ github.run_id }}
          restore-keys: |
            god-data-ollama-
            god-data-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Deps - MUCKSCRAPER + VUZA + OLLAMA
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update || true
          sudo apt-get install -y imagemagick ffmpeg espeak-ng curl
          echo "Installing Ollama for MuckScraper + Hook/Retain/Reward - 100% FREE..."
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          sleep 8
          ollama pull llama3.1:8b || echo "Ollama pull failed, will use Gemini fallback"
          ollama list
          echo "Ollama ready for MuckScraper + Automated-Shorts-Generator"

      - name: Install Python Deps - FIXED pkg_resources + MUCKSCRAPER + VUZA
        run: |
          python -m pip install --upgrade pip setuptools==68.0.0 wheel
          pip install --no-cache-dir -r requirements.txt
          python -c "import pkg_resources; print('pkg_resources OK - FIXED')"
          python -c "from moviepy.editor import VideoFileClip; print('moviepy.editor OK - VUZA ready')"
          python -c "import bs4, lxml; print('MuckScraper deps OK - BeautifulSoup + lxml')"
          python -c "import ollama; print('Ollama pip OK - Hook/Retain/Reward ready')" || echo "Ollama pip not installed, using requests fallback"
          python -c "from gtts import gTTS; print('gTTS OK - VUZA offline TTS ready')"

      - name: Create dirs - VUZA OFFLINE + TOKEN_JSON
        run: |
          mkdir -p data output temp models && touch src/__init__.py
          echo "$TOKEN_JSON" > token.json || echo '{}' > token.json
          echo "$TOKEN_JSON" > data/token.json || true
          ls -lh token.json || true
          echo "Dirs ready for VUZA offline + TOKEN_JSON ready for upload"
        env:
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}

      - name: Run GOD BOT - MUCKSCRAPER + HOOK/RETAIN/REWARD + VUZA OFFLINE - 100% FREE
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OLLAMA_MODEL: llama3.1:8b
          OLLAMA_URL: http://localhost:11434/api/generate
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PYTHONPATH: src:.:${{ github.workspace }}:${{ github.workspace }}/src
        run: |
          echo "GOD LEVEL BOT - MUCKSCRAPER + HOOK/RETAIN/REWARD + VUZA OFFLINE - 5 LEGS - 100% FREE"
          echo "Leg1 Research God - MuckScraper live HTML scrape + Ollama grouping - 100% FREE"
          echo "Leg2 Script God - Automated-Shorts-Generator Hook/Retain/Reward - Ollama first, Gemini fallback"
          echo "Leg3 Editor God - VUZA / Open Montage offline - ColorClip + local assets, no paid API needed"
          echo "Leg4 Boss Approval - MuckScraper viral score + Ollama fact check - 2 of 3 PASS"
          echo "Leg5 Uploader God - World viral upload - 11-15 sec retention power 1.6X - TOKEN_JSON FIXED"
          python main.py

      - name: Upload Artifact - VUZA OFFLINE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: god-output-muckscraper-vuza-${{ github.run_number }}
          path: |
            output/
            data/
          if-no-files-found: ignore
