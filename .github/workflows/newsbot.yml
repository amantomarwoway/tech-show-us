# UPDATED JULY 2025 - GEMINI 3.6 FLASH LATEST + CHATGPT FALLBACK
name: Tech Show US Bot - GEMINI 3.6 FLASH JULY + CHATGPT FALLBACK - FIXED RUNNER

on:
  schedule:
    - cron: '30 10 * * *'
    - cron: '30 16 * * *'
    - cron: '0 13 * * *'
    - cron: '0 19 * * *'
    - cron: '0 22 * * *'
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Visualping Hashes
        uses: actions/cache@v4
        with:
          path: data/
          key: visualping-hashes-${{ github.run_id }}
          restore-keys: |
            visualping-hashes-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Deps
        run: sudo apt-get update && sudo apt-get install -y imagemagick ffmpeg

      - name: Install Python Deps
        run: |
          pip install --upgrade pip
          pip install Pillow==9.5.0
          pip install -r requirements.txt
          pip install pytrends feedparser requests urllib3 openai google-generativeai --upgrade
          pip install openai --upgrade

      - name: Create data dir
        run: mkdir -p data output temp && touch src/__init__.py && echo "# src package fixed" > src/__init__.py

      - name: Check src files exist - FIXED
        run: ls -la src/breakout_detector.py src/main.py src/__init__.py && python -c "import sys; print(sys.version)"

      - name: Run Bot - FIXED NO SAFE EXIT NO FORCE PASS
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONPATH: src:.:${{ github.workspace }}:${{ github.workspace }}/src
        run: |
          echo "🔥 FIXED RUNNER - NO 7 ERRORS - NO SAFE EXIT - NO FORCE PASS"
          echo "Fix1: BREAKOUT_AVAILABLE=True - sys.path fixed"
          echo "Fix2: Python 3.11"
          echo "Fix3: US ONLY - no Germany/Canada"
          echo "Fix4: Google Title fixed - no Firefox"
          echo "Fix5: Gemini 3.6 Flash July 2025 + ChatGPT fallback"
          echo "Fix6: Fact checker method_whitelist patched - 2/3 logic - no force pass"
          echo "Fix7: Safe exit closed"
          python src/main.py

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ github.run_number }}
          path: |
            output/
            data/breakout_cache.json
            data/visualping_hashes.json
            data/visualping_cache.json
            logs.txt
          if-no-files-found: ignore

      - name: Show Stats
        if: always()
        run: |
          cat data/breakout_cache.json 2>/dev/null | head -50 || echo "No cache"
          cat data/visualping_hashes.json 2>/dev/null | head -20 || echo "No hashes"
