name: GOD LEVEL BOT - 5 LEGS

on:
  schedule:
    # 5 runs at peak hours (UTC = EST + 5)
    # 9 AM EST | 1 PM EST | 4 PM EST | 7 PM EST | 10 PM EST
    - cron: '0 13 * * *'
    - cron: '0 17 * * *'
    - cron: '0 20 * * *'
    - cron: '0 23 * * *'
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Cache Data
        uses: actions/cache@v4
        with:
          path: |
            data/
            models/
          key: god-data-${{ github.run_id }}
          restore-keys: god-data-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Deps (EMOJI + FONTS)
        run: |
          sudo apt-get update || true
          sudo apt-get install -y \
            imagemagick ffmpeg \
            fonts-dejavu fonts-dejavu-extra fonts-liberation \
            fonts-noto-color-emoji \
            fonts-noto-core \
            fonts-symbola
          fc-cache -f -v
          echo "=== EMOJI FONTS CHECK ==="
          fc-list | grep -i emoji || echo "No emoji fonts found"
          echo "=== DEJAVU FONTS ==="
          fc-list | grep -i dejavu | head -5
          echo "=== TOTAL FONTS ==="
          fc-list | wc -l

      - name: Install Python Deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --no-cache-dir -r requirements.txt

      - name: Create Directories
        run: |
          mkdir -p data output temp models logs
          mkdir -p output/videos output/thumbnails
          touch src/__init__.py
          touch src/collectors/__init__.py
          touch src/intelligence/__init__.py
          touch src/verification/__init__.py
          touch src/writing/__init__.py
          touch src/media/__init__.py
          touch src/youtube/__init__.py
          touch src/safety/__init__.py
          touch src/learning/__init__.py
          touch src/utils/__init__.py

      - name: Run GOD BOT
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PYTHONPATH: src:.:${{ github.workspace }}:${{ github.workspace }}/src
          LOG_LEVEL: INFO
        run: python main.py

      - name: Debug Output
        if: always()
        run: |
          echo "=== OUTPUT ==="
          ls -lh output/ || true
          echo "=== DATA ==="
          ls -lh data/ || true
          echo "=== LOGS ==="
          tail -100 logs/bot.log || true

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: god-output-${{ github.run_number }}
          path: |
            output/
            data/
            logs/
          if-no-files-found: ignore
          retention-days: 7
