name: GOD LEVEL BOT - AUTONOMOUS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * *'
    - cron: '0 20 * * *'
    - cron: '0 1 * * *'

permissions:
  contents: write

jobs:
  run-bot:
    name: Autonomous Bot
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Data
        uses: actions/cache@v4
        with:
          path: |
            data/
            models/
          key: god-data-${{ github.run_id }}
          restore-keys: |
            god-data-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Deps
        run: |
          sudo apt-get update || true
          sudo apt-get install -y imagemagick ffmpeg fonts-dejavu fonts-dejavu-extra fonts-liberation fonts-noto-color-emoji fonts-noto-core fonts-symbola
          fc-cache -f -v

      - name: Install Python Deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --no-cache-dir -r requirements.txt

      - name: Create Directories
        run: |
          mkdir -p data output temp models logs
          mkdir -p output/videos output/thumbnails
          mkdir -p data/code_backups
          touch src/__init__.py
          touch src/collectors/__init__.py
          touch src/intelligence/__init__.py
          touch src/verification/__init__.py
          touch src/writing/__init__.py
          touch src/media/__init__.py
          touch src/youtube/__init__.py
          touch src/safety/__init__.py
          touch src/learning/__init__.py
          touch src/utils/__init__.py

      - name: Setup Git
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@tech-show-us.bot"

      - name: Run Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PYTHONPATH: src:.:${{ github.workspace }}
          LOG_LEVEL: INFO
          PYTHONWARNINGS: ignore
        run: python main.py

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: god-output-${{ github.run_number }}
          path: |
            output/
            data/
            logs/
          if-no-files-found: ignore
          retention-days: 7
