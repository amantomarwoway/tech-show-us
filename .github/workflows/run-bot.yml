name: GOD LEVEL BOT - AUTONOMOUS

"on":
  schedule:
    - cron: '0 13 * * *'
    - cron: '0 17 * * *'
    - cron: '0 20 * * *'
    - cron: '0 23 * * *'
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  models: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Data (persistent)
        uses: actions/cache@v4
        with:
          path: |
            data/
            models/
          key: god-data-v1
          restore-keys: |
            god-data-v1
            god-data-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Deps
        run: |
          sudo apt-get update || true
          sudo apt-get install -y imagemagick ffmpeg fonts-dejavu fonts-dejavu-extra fonts-liberation fonts-noto-color-emoji fonts-noto-core fonts-symbola
          fc-cache -f -v

      - name: Install Python Deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --no-cache-dir -r requirements.txt

      - name: Create Directories
        run: |
          mkdir -p data output temp models logs
          mkdir -p output/videos output/thumbnails
          mkdir -p data/code_backups
          touch src/__init__.py
          touch src/collectors/__init__.py
          touch src/intelligence/__init__.py
          touch src/verification/__init__.py
          touch src/writing/__init__.py
          touch src/media/__init__.py
          touch src/youtube/__init__.py
          touch src/safety/__init__.py
          touch src/learning/__init__.py
          touch src/utils/__init__.py

      - name: Setup Git
        run: |
          git config --global user.name "AI Repair Bot"
          git config --global user.email "ai-repair@tech-show-us.bot"

      - name: Run GOD BOT
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONPATH: src:.:${{ github.workspace }}:${{ github.workspace }}/src
          LOG_LEVEL: INFO
          PYTHONWARNINGS: ignore
        run: python main.py

      - name: Debug Output
        if: always()
        run: |
          echo "=== SNAPSHOTS ==="
          if [ -f data/trending_snapshots.json ]; then
            python -c "import json; d=json.load(open('data/trending_snapshots.json')); print(f'Total videos tracked: {len(d)}'); multi=sum(1 for v in d.values() if len(v)>=2); print(f'Rising ready (2+ snapshots): {multi}')" || cat data/trending_snapshots.json
          else
            echo "No snapshots yet"
          fi
          echo ""
          echo "=== OUTPUT ==="
          ls -lh output/ || true
          echo ""
          echo "=== LOGS (last 30) ==="
          tail -30 logs/bot.log || true

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: god-output-${{ github.run_number }}
          path: |
            output/
            data/
            logs/
          if-no-files-found: ignore
          retention-days: 7
