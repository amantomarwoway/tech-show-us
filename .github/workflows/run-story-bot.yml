name: HEY DARKY STORY BOT

# A weekly SERIES SHOW: three stories run in parallel, each with a fixed weekly slot in US Eastern time
# (default Wed / Fri / Sun 8 PM ET — crime & horror viewers watch late at night). Every week each story
# gets its next part; a hit is extended, a flop wrapped up, and a finished story's slot starts a new one.
#
#   06:00 UTC  build job  -> if a weekly slot opens inside the next few days, builds ONE episode (~30-60 min)
#                            with its 2-3 Shorts and SCHEDULES everything: YouTube + Facebook publish
#                            by themselves at the slot, no job has to be awake then.
#   21:05 + 22:05 UTC     -> queue job: posts the Instagram Reels that are due. Instagram has no scheduler,
#                            and 5 PM ET is 21:00 UTC in summer / 22:00 UTC in winter — both are listed so
#                            one of the two always lands right after the Short's slot (the other finds
#                            nothing due and ends in a minute).
# Long episode -> YouTube + Facebook. Every Short -> YouTube + Facebook + Instagram.
# To change the days/times of the SHOW edit LONG_SLOTS_DEFAULT in src/config.py (US Eastern time); the
# crons below only control when the bot wakes up.
on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '5 21 * * *'
    - cron: '5 22 * * *'
  workflow_dispatch:
    inputs:
      command:
        description: 'What to run'
        type: choice
        options: [build, publish-queue]
        default: build
      force:
        description: 'build: look two weeks ahead instead of the usual few days (use it to build now)'
        type: boolean
        default: false

# One writer of data/words.db at a time (builds, queue runs and analytics all commit it).
concurrency:
  group: hey-darky-db
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONUNBUFFERED: "1"      # live logs while the 2-hour render runs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Decide command
        id: cmd
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "command=${{ inputs.command }}" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.force }}" = "true" ]; then echo "force=--force" >> "$GITHUB_OUTPUT"; else echo "force=" >> "$GITHUB_OUTPUT"; fi
          elif [ "${{ github.event.schedule }}" = "0 6 * * *" ]; then
            echo "command=build" >> "$GITHUB_OUTPUT"; echo "force=" >> "$GITHUB_OUTPUT"
          else
            echo "command=publish-queue" >> "$GITHUB_OUTPUT"; echo "force=" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache ML models
        uses: actions/cache@v4
        with:
          path: |
            data/piper/
            ~/.cache/huggingface/
            ~/.cache/torch/
          key: ml-models-v1

      # Freesound downloads are cached forever: a keyword fetched once is never fetched again.
      - name: Restore audio cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: audio_cache
          key: audio-cache-${{ github.run_id }}
          restore-keys: audio-cache-

      # Yesterday's queued Short(s) live here between runs.
      - name: Restore pending Shorts
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: pending
          key: pending-${{ github.run_id }}
          restore-keys: pending-

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      # The queue job only posts files that already exist: it needs no speech/ML libraries, so it
      # installs just what the imports and the pre-flight tests touch and finishes in about a minute.
      - name: Install Python deps (light, for the queue job)
        if: steps.cmd.outputs.command != 'build'
        run: pip install requests PyYAML tzdata Pillow google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Install Python deps
        if: steps.cmd.outputs.command == 'build'
        run: pip install -r requirements.txt

      # Offline fallback voice. OPTIONAL: if its install ever breaks, the bot still runs
      # (Edge TTS is the real voice; this only matters if Microsoft's service is down).
      - name: Install Piper fallback voice (optional)
        if: steps.cmd.outputs.command == 'build'
        continue-on-error: true
        run: pip install piper-tts

      # Optional browser-based niche research (Node + Puppeteer). A failure here must
      # never block the bot: research falls back to the official YouTube API alone.
      - uses: actions/setup-node@v4
        if: steps.cmd.outputs.command == 'build'
        continue-on-error: true
        with:
          node-version: '20'
      - name: Install trending-scraper deps (optional)
        if: steps.cmd.outputs.command == 'build'
        continue-on-error: true
        timeout-minutes: 10
        run: cd tools/trending-scraper && npm install --no-audit --no-fund

      # Fails in seconds (not after a 90-minute render) if any import/wiring/secret is broken.
      - name: Pre-flight wiring checks
        run: |
          python tools/wiring_audit.py
          python -m unittest discover -s tests -p "test_*.py"

      - name: Run Hey Darky story bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # "1" (default) = everything private/unpublished + Instagram skipped, for you to review.
          # Set the repo VARIABLE REVIEW_MODE=0 for fully automatic public publishing.
          REVIEW_MODE: ${{ vars.REVIEW_MODE || '0' }}
        run: python main_story.py ${{ steps.cmd.outputs.command }} ${{ steps.cmd.outputs.force }}

      - name: Save audio cache
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: audio_cache
          key: audio-cache-${{ github.run_id }}

      - name: Save pending Shorts
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: pending
          key: pending-${{ github.run_id }}

      - name: Commit DB back
        if: always()
        run: |
          git config user.name "heydarky-bot"
          git config user.email "bot@heydarky.local"
          git add data/words.db data/related_video_checklist.md || true
          git diff --staged --quiet || git commit -m "db: story bot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase || true
          git push || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-output-${{ github.run_id }}
          path: |
            output/*.json
            logs/
            data/words.db
            data/related_video_checklist.md
          retention-days: 7
