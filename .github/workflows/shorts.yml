name: USA Trend Video Bot

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install System Deps - FIXED
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install --upgrade pip
          # Direct install - requirements.txt ko ignore karenge taaki dusre bots se ladai na ho
          pip install pytrends google-generativeai moviepy==1.0.3 requests Pillow==9.5.0 piper-tts imageio-ffmpeg
          playwright install --with-deps chromium

      - name: Download Piper Voice Model
        run: |
          mkdir -p piper_model
          wget -q -O piper_model/en_US-amy-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/amy/medium/en_US-amy-medium.onnx
          wget -q -O piper_model/en_US-amy-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/amy/medium/en_US-amy-medium.onnx.json

      - name: Run Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python bot.py

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-video-4k
          path: output/*.mp4
