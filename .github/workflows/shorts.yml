name: USA Trending Shorts Bot

on:
  schedule:
    - cron: '0 13 * * *' # 8 AM EST USA
    - cron: '0 18 * * *' # 1 PM EST USA
    - cron: '0 1 * * *' # 8 PM EST USA
  workflow_dispatch:

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick
          sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' /etc/ImageMagick-6/policy.xml || true

      - name: Install Python Deps
        run: |
          pip install --upgrade pip
          pip install Pillow moviepy==1.0.3 imageio imageio-ffmpeg requests piper-tts numpy google-api-python-client google-auth-httplib2 google-auth-oauthlib feedparser onnxruntime pytrends lxml huggingface_hub gradio_client

      - name: Download Piper American Voice
        run: |
          wget -q https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx
          wget -q https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json

      - name: Run Bot
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python nbot.py
