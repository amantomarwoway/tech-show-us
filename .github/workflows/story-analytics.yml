name: HEY DARKY STORY ANALYTICS

# Daily: copies REAL watch-time / CTR / views from YouTube Analytics into the
# database so the bot can learn which content pillar this audience likes and
# lean the next story toward it (src/pattern_analytics.py).
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

concurrency:
  group: hey-darky-db
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Sync story analytics
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m src.story_analytics_sync
      - name: Commit DB back
        if: always()
        run: |
          git config user.name "heydarky-bot"
          git config user.email "bot@heydarky.local"
          git add data/words.db || true
          git diff --staged --quiet || git commit -m "db: story analytics $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase || true
          git push || true
