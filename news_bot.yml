name: GOD LEVEL 5 BRAIN FINAL
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: data/
          key: god-5brain-${{ github.run_id }}
          restore-keys: god-5brain-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update || true
          sudo apt-get install -y ffmpeg imagemagick
      - run: |
          pip install --upgrade pip
          pip install Pillow==9.5.0
          pip install -r requirements.txt
      - run: mkdir -p data output temp output/assets && touch src/__init__.py
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PYTHONPATH: src:.:${{ github.workspace }}/src
        run: python main.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: god-output-${{ github.run_number }}
          path: |
            output/
            data/
          if-no-files-found: ignore
